name: Test Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: check nodeJS version
        run: node -v
      - name: install NodeS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: check nodeJS version
        run: node -v
      - name: instal depenendcies
        run: npm ci
      - name: run test
        run: npm test
